<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AniRate Prototype - Android</title>
  <style>
    :root{--bg:oklch(14% .03 255);--surface:oklch(19% .035 255);--surface-2:oklch(23% .04 255);--fg:oklch(96% .01 245);--muted:oklch(72% .025 250);--border:oklch(32% .04 255);--accent:oklch(72% .17 156);--accent-2:oklch(69% .19 252);font-family:"Roboto","Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,oklch(9% .03 255),oklch(15% .04 180));color:var(--fg)}.pixel{width:min(412px,100vw);height:min(900px,100vh);border:9px solid #06070a;border-radius:34px;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 30px 80px rgb(0 0 0/.45)}.camera{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:13px;height:13px;background:#020306;border-radius:50%;z-index:3}.status{height:42px;padding:12px 18px 0;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.screen{height:calc(100% - 42px);padding:10px 16px 84px;overflow:auto}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--bg);font-weight:900}h1{font-size:28px;margin:0}.search{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:28px;background:var(--surface);padding:13px 15px;color:var(--muted);min-height:52px}.chips{display:flex;gap:8px;overflow:auto;padding:14px 0}.chip{border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);padding:9px 12px;white-space:nowrap}.chip.active{background:color-mix(in oklch,var(--accent) 22%,var(--surface));border-color:var(--accent);color:var(--accent)}.card{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:14px;margin-bottom:12px}.title-card{min-height:230px;background:linear-gradient(160deg,oklch(22% .07 252),oklch(18% .04 156));display:flex;flex-direction:column;justify-content:flex-end}.title-card h2{font-size:34px;line-height:1;margin:0}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font:12px ui-monospace,Menlo,monospace}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}.mini{width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}.score{font-weight:900;color:var(--accent)}.fab{position:absolute;right:22px;bottom:78px;width:58px;height:58px;border:0;border-radius:18px;background:var(--accent);color:var(--bg);font-size:26px;box-shadow:0 18px 50px color-mix(in oklch,var(--accent) 25%,transparent)}.nav{position:absolute;left:0;right:0;bottom:0;height:64px;border-top:1px solid var(--border);background:var(--surface);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:var(--muted)}.nav .active{color:var(--accent);font-weight:800}.gesture{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:108px;height:4px;border-radius:999px;background:#fff;opacity:.45}
  </style>
</head>
<body>
  <main class="pixel" aria-label="Android app prototype"><div class="camera"></div><div class="status"><span>9:41</span><span>5G 82%</span></div><section class="screen">
    <header class="bar"><div><h1>AniRate</h1><div class="meta"><span>database companion</span></div></div><div class="avatar">A</div></header>
    <div class="search">Search anime database</div><div class="chips"><button class="chip active">Top fit</button><button class="chip">Managers</button><button class="chip">Studios</button><button class="chip">Hidden gems</button></div>
    <article class="card title-card"><div class="meta"><span>Action</span><span>89 fit</span><span>Airing</span></div><h2>Dandadan</h2></article>
    <article class="card"><div class="list"><div class="item"><div class="mini"></div><div><b>Jujutsu Kaisen</b><div class="meta">battle system compare</div></div><span class="score">91</span></div><div class="item"><div class="mini"></div><div><b>Mob Psycho 100</b><div class="meta">completed classic</div></div><span class="score">93</span></div><div class="item"><div class="mini"></div><div><b>Chainsaw Man</b><div class="meta">studio signal</div></div><span class="score">86</span></div></div></article>
    <article class="card"><b>Auto-build watch plan</b><p style="color:var(--muted);line-height:1.45;margin:8px 0 0">Balances episode length, tone, and completion status for a weekend queue.</p></article>
  </section><button class="fab" id="fab">＋</button><nav class="nav"><button class="active">Hub</button><button>DB</button><button>Stats</button><button>Saved</button></nav><div class="gesture"></div></main>
  <script>document.getElementById("fab").addEventListener("click",e=>{e.currentTarget.textContent="✓";e.currentTarget.style.background="var(--accent-2)"})</script>
</body>
</html>
