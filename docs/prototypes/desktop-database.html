<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AniRate Prototype - Desktop Database</title>
  <style>
    :root{--bg:oklch(14% .03 255);--surface:oklch(19% .035 255);--surface-2:oklch(23% .04 255);--fg:oklch(96% .01 245);--muted:oklch(72% .025 250);--border:oklch(32% .04 255);--accent:oklch(72% .17 156);--accent-2:oklch(69% .19 252);--warn:oklch(77% .16 76);--font:"Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono","JetBrains Mono",ui-monospace,Menlo,monospace}
    *{box-sizing:border-box}body{margin:0;background:oklch(11% .03 255);color:var(--fg);font-family:var(--font)}button,input,select{font:inherit}a{color:inherit;text-decoration:none}.workbench{display:grid;grid-template-columns:72px 300px 1fr 340px;min-height:100vh}.dock,.filters,.inspector{border-right:1px solid var(--border);background:var(--bg)}.dock{display:grid;align-content:start;justify-items:center;gap:12px;padding:16px 10px}.dock a,.dock button{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--muted);display:grid;place-items:center}.dock .active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:900}.filters{padding:18px;display:grid;align-content:start;gap:14px}.brand{font-weight:900;margin-bottom:6px}.field{display:grid;gap:7px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.field input,.field select{border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--fg);padding:11px 12px;text-transform:none;letter-spacing:0}.check{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--fg);text-transform:none;letter-spacing:0;background:var(--surface)}.center{padding:18px;overflow:auto}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.toolbar h1{font-size:28px;margin:0}.primary{border:0;border-radius:10px;background:var(--accent);color:var(--bg);font-weight:850;padding:11px 13px}.table{min-width:920px;border:1px solid var(--border);border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:42px 1.5fr .55fr .55fr .6fr .7fr .7fr .8fr;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface)}.row:nth-child(even){background:oklch(17% .033 255)}.row:last-child{border-bottom:0}.head{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--muted);font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em}.num{font-family:var(--mono);font-variant-numeric:tabular-nums}.pill{justify-self:start;border:1px solid color-mix(in oklch,var(--accent) 60%,var(--border));border-radius:999px;padding:5px 8px;color:var(--accent);font:11px var(--mono);background:color-mix(in oklch,var(--accent) 10%,transparent)}.inspector{border-right:0;border-left:1px solid var(--border);padding:18px;display:grid;align-content:start;gap:14px}.panel{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:14px}.panel h2{font-size:17px;margin:0 0 12px}.radar{aspect-ratio:1;border:1px solid var(--border);border-radius:14px;background:radial-gradient(circle,var(--surface-2),var(--surface));display:grid;place-items:center;position:relative;overflow:hidden}.radar:before{content:"";width:68%;height:68%;clip-path:polygon(50% 0,88% 26%,82% 82%,50% 100%,14% 80%,8% 28%);background:color-mix(in oklch,var(--accent) 35%,transparent);border:2px solid var(--accent)}.compare-list{display:grid;gap:9px}.compare-item{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}.compare-item b{color:var(--fg);font-family:var(--mono)}@media(max-width:1180px){.workbench{grid-template-columns:68px 1fr}.filters,.inspector{display:none}.center{padding:14px}}@media(max-width:760px){.workbench{display:block}.dock{display:flex;position:sticky;top:0;z-index:4;border-bottom:1px solid var(--border);border-right:0}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="workbench">
    <nav class="dock" aria-label="Database tools"><a class="active" href="index.html">A</a><button>⌕</button><button>⇄</button><button>★</button><button>▦</button></nav>
    <aside class="filters"><div class="brand">AniRate DB</div><label class="field">Search<input id="q" placeholder="title, studio, tag"></label><label class="field">Season<select><option>All seasons</option><option>Winter</option><option>Spring</option><option>Summer</option><option>Fall</option></select></label><label class="field">Minimum score<input type="range" min="0" max="10" value="8"></label><div class="check"><span>Completed only</span><input type="checkbox"></div><div class="check"><span>Hide sequels</span><input type="checkbox"></div><button class="primary" id="apply">Apply filters</button></aside>
    <section class="center">
      <div class="toolbar"><h1>Anime tactical database</h1><button class="primary" id="compare">Add selected to compare tray</button></div>
      <div class="table" id="db"></div>
    </section>
    <aside class="inspector">
      <div class="panel"><h2>Selected title radar</h2><div class="radar" aria-label="Radar chart preview"></div></div>
      <div class="panel"><h2>Comparison tray</h2><div class="compare-list" id="tray"><div class="compare-item"><span>Frieren</span><b>98 fit</b></div><div class="compare-item"><span>Vinland Saga</span><b>94 fit</b></div></div></div>
      <div class="panel"><h2>Decision notes</h2><p style="color:var(--muted);line-height:1.5;margin:0">Use this view like eFHUB’s player database: filter hard, inspect stats, compare candidates, then save a final watch build.</p></div>
    </aside>
  </main>
  <script>
    const data=[["01","Frieren","Madhouse","9.4","98","Fantasy","Completed","watch next"],["02","Vinland Saga","MAPPA","9.1","94","Drama","Completed","saved"],["03","Jujutsu Kaisen","MAPPA","8.7","91","Action","Airing","compare"],["04","Apothecary Diaries","Toho","8.9","92","Drama","Airing","watch next"],["05","Dungeon Meshi","Trigger","8.8","90","Fantasy","Completed","saved"],["06","Dandadan","Science SARU","8.5","89","Action","Airing","hot"],["07","Mob Psycho 100","Bones","8.9","93","Action","Completed","classic"],["08","Odd Taxi","OLM","8.6","88","Mystery","Completed","gem"]];
    const db=document.getElementById("db");
    function draw(q=""){db.innerHTML='<div class="row head"><span></span><span>Title</span><span>Studio</span><span>Score</span><span>Fit</span><span>Genre</span><span>Status</span><span>Signal</span></div>'+data.filter(r=>r.join(" ").toLowerCase().includes(q.toLowerCase())).map(r=>`<div class="row"><input type="checkbox"><strong>${r[1]}</strong><span>${r[2]}</span><span class="num">${r[3]}</span><span class="num">${r[4]}</span><span>${r[5]}</span><span>${r[6]}</span><span class="pill">${r[7]}</span></div>`).join("")}
    draw();document.getElementById("q").addEventListener("input",e=>draw(e.target.value));document.getElementById("compare").addEventListener("click",()=>{document.getElementById("tray").insertAdjacentHTML("beforeend",'<div class="compare-item"><span>Apothecary Diaries</span><b>92 fit</b></div>')});
  </script>
</body>
</html>
