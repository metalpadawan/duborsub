# Local PostgreSQL for AniRate development: `npm run db:up` from the repo root.
# The password comes from the git-ignored repo-root .env, which `npm run db:up`
# creates with a random value on first run (database/setup-local.mjs).
services:
  postgres:
    image: postgres:16-alpine
    container_name: anirate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anirate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run "npm run db:up" from the repo root to create .env with a database password}
      POSTGRES_DB: anime_platform
    ports:
      # This machine only: the database is never reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - anirate-postgres:/var/lib/postgresql/data
      # Creates the separate database the backend tests use.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anirate -d anime_platform']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  anirate-postgres:
